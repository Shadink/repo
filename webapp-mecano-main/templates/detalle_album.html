<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>{{ nombre }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <link rel="icon" href="{{ url_for('static', filename='img/album' ~ imgnum ~ '.png') }}">

    </head>
    <body>
        <div class="grid">
            <img class="graph" src="{{ url_for('static', filename='img/album' ~ imgnum ~ 'lyrics.png') }}">
            <p class="desc">{{ descripcion }}</p>
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/album/{{albumid}}?utm_source=generator&theme=0" width="100%" height="300" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            <img class="graph" src="{{ url_for('static', filename='img/graphalbum' ~ imgnum ~ '.png') }}">
        </div>
    </body>
</html>
